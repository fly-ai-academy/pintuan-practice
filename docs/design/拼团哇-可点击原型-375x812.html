function showModal(body){$('overlay').innerHTML=`<div class="modal-wrap" role="dialog" aria-modal="true"><div class="modal">${body}</div></div>`;setTimeout(()=>$('overlay').querySelector('button,input')?.focus(),0)}function closeModal(){$('overlay').innerHTML=''}function confirmAction(text,action){showModal(`<h3>请确认</h3><p>${text}</p>${full('确认',`closeModal();${action}`)}${full('暂不操作','closeModal()','outline')}`)}
function nav(route){if(S.route==='A02'&&dirty&&route!=='A03'){showModal(`<h3>保存本次编辑？</h3><p class="muted">离开前可以保存草稿，或仅放弃本轮尚未保存的输入。</p>${full('保存后离开',`saveDraft('${route}')`)}${full('继续编辑','closeModal()','outline')}${full('放弃本次编辑',`dirty=false;editing=null;closeModal();go('${route}')`,'danger')}`);return}go(route)}function go(route){if(!META[route]&&route!=='orders')route='B01';historyRoutes.push(S.route);S.route=route;errors={};closeModal();persist();render();$('screen').scrollTop=0}function back(){const defaults={A02:'A01',A03:'A02',A04:'A01',B02:'B01',B03:'B02',B04:'B03',C01:'C02',C02:'B03',C03:'orders',C04:'orders',D01:'C03',D02:'orders',D03:'C03',D04:'orders',E01:'B02',E02:'orders',E03:'orders',E04:'A04',F01:'A04',F02:'F01',F03:'orders',F04:'orders'};nav(defaults[S.route]||'B01')}
function foot(html){$('bottom').innerHTML=`<div class="footer">${html}</div>`}function tabbar(){ $('bottom').innerHTML=`<div class="bottom-nav"><button class="${S.route==='B01'?'selected':''}" onclick="nav('B01')"><span>⌂</span>拼团广场</button><button class="${S.route==='orders'?'selected':''}" onclick="nav('orders')"><span>▤</span>我的订单</button>${S.role==='host'?`<button class="${S.route==='A01'?'selected':''}" onclick="nav('A01')"><span>✳</span>我的拼团</button>`:''}</div>`}
function sumQty(){return S.qty.reduce((a,b)=>a+b,0)}function total(){return S.qty.reduce((a,q,i)=>a+q*S.group.specs[i].price,0)}function paidCount(){return S.group.paid+(S.order&&['paid','shipped','complete','refund','refunded'].includes(S.order.state)?S.order.items.reduce((a,b)=>a+b.qty,0):0)}function available(i){return S.group.specs[i].stock-(S.order&&['pending','paid','shipped','complete'].includes(S.order.state)?(S.order.items.find(x=>x.index===i)?.qty||0):0)}
function orderItems(){return S.order?S.order.items.map(x=>`<div class="row" style="margin:10px 0">${bear(x.index===1)}<div class="col"><b>${esc(S.order.title)}</b><div class="muted">${esc(x.name)} × ${x.qty}</div></div><b>¥${money(x.price*x.qty)}</b></div>`).join(''):''}function orderCard(){return S.order?`<div class="card">${orderItems()}<div class="line"></div><div class="row"><span>合计</span><span class="money"><small>¥</small>${money(S.order.total)}</span></div><div class="muted">订单号 ${S.order.id}</div></div>`:''}function rules(g=S.group){return `<div class="card"><div class="row"><span class="muted">最低成团件数</span><b>${g.min} 件</b></div><div class="line"></div><div class="row"><span class="muted">截止时间</span><span>${fmt(g.cut)}</span></div><div class="row"><span class="muted">预计发货</span><span>${fmt(g.ship).slice(0,10)}</span></div><div class="notice">截止后按已支付件数判断；未成团自动模拟退款。</div></div>`}
function groupCard(){return `<div class="card"><div class="row start">${art()}<div class="col"><b>${esc(S.group.title)}</b><div class="money"><small>¥</small>${money(Math.min(...S.group.specs.map(x=>x.price)))}<small> 起</small></div><div class="muted">${S.group.specs.length} 个规格 · 手作好物</div></div></div><div class="progress"><span style="width:${Math.min(100,paidCount()/S.group.min*100)}%"></span></div><div class="row"><span class="muted">已拼 ${paidCount()}/${S.group.min} 件</span><span class="tag">${S.group.state==='open'?'进行中':S.group.state==='success'?'已成团':S.group.state==='failed'?'未成团':'结果确认中'}</span></div></div>`}
function expired(){if(S.order?.state==='pending'&&(now()>=S.order.expires||now()>=S.group.cut)){S.order.state='closed';S.order.reason='支付超时，订单已关闭';persist();return true}return false}
function render(){expired();const r=S.route,m=META[r]||['我的订单','查看本人订单的最新状态。'];$('nav').innerHTML=`${['B01','A01','orders'].includes(r)?'':`<button class="back" aria-label="返回" onclick="back()">‹</button>`}<strong>${m[0]}</strong><span class="capsule">··· ◉</span>`;$('routeLabel').textContent=r==='orders'?'订单入口':r;$('routeName').textContent=m[0];$('routeNote').textContent=m[1];$('buyerRole').className=S.role==='buyer'?'active':'';$('hostRole').className=S.role==='host'?'active':'';$('map').innerHTML=Object.entries(META).map(([id,v])=>`<button class="${r===id?'active':''}" onclick="jump('${id}')"><small>${id}</small>${v[0]}</button>`).join('');$('bottom').innerHTML='';let out='';if(S.mode==='error'){out=`<div class="empty"><div class="symbol">☁</div><h3>暂时无法加载</h3><p class="muted">请重试，已填写内容不会丢失。</p>${full('重新加载',"S.mode='normal';render()")}</div>`}else if(S.mode==='denied'||(['A01','A02','A03','A04','E04','F01','F02'].includes(r)&&S.role!=='host')){out=`<div class="empty"><div class="symbol">⊘</div><h3>暂无访问权限</h3><p class="muted">仅团长可以管理本人的拼团。</p>${full('返回拼团广场',"S.mode='normal';go('B01')")}</div>`}else out=views[r]?views[r]():views.orders();$('screen').innerHTML=out;persist();}
const views={
B01(){tabbar();return `<div class="row"><div><div class="eyebrow">GOOD THINGS, TOGETHER</div>${title('把喜欢，拼在一起')}</div><span class="logo-icon">✳</span></div><p class="sub">精选手作好物 · 和同好一起等花开</p><div class="tabs" style="margin-top:22px"><button class="${S.listTab==='open'?'selected':''}" onclick="S.listTab='open';render()">进行中</button><button class="${S.listTab==='ended'?'selected':''}" onclick="S.listTab='ended';render()">已结束</button></div>${S.mode==='empty'||(S.listTab==='open')!==(S.group.state==='open')?'<div class="empty"><div class="symbol">♧</div><h3>这里还没有拼团</h3><p class="muted">换个分类再看看吧。</p></div>':`<button style="padding:0;background:none;width:100%;text-align:left" onclick="go('B02')"><div class="hero">${art(true)}<span class="tag">小小手作 · 暖暖心意</span><span class="hero-word">HANDMADE WITH LOVE</span></div>${groupCard()}</button>`}<div class="time-note">每一次相聚，都让喜欢更值得。</div>`},
B02(){foot(S.group.state==='open'&&S.group.cut>now()?btn('选择规格 · 参团',"go('B03')"):btn('查看拼团结果',`go('${S.group.state==='success'?'E02':S.group.state==='failed'?'E03':'E01'}')`));return `<div class="hero">${art(true)}<span class="tag">手作限定</span></div><div class="row"><span class="money"><small>¥</small>${money(Math.min(...S.group.specs.map(x=>x.price)))}</span><span class="tag">${S.group.specs.length} 个规格可选</span></div>${title(S.group.title)}<p class="sub">${esc(S.group.desc)}</p>${groupCard()}${rules()}<div class="notice">本项目为模拟交易，不产生真实扣款及物流。</div>`},
B03(){foot(`<div><span class="muted">已选 ${sumQty()} 件</span><div class="money"><small>¥</small>${money(total())}</div></div>${btn('下一步',"chooseNext()",'primary',!sumQty()||S.group.state!=='open')}`);return `<div class="row">${art()}<div><b>${esc(S.group.title)}</b><div class="sub">选择喜欢的颜色，可同时购买多个规格</div></div></div><h3 class="section-title">商品规格</h3>${S.group.specs.map((x,i)=>`<div class="card"><div class="row">${bear(i===1)}<div class="col"><b>${esc(x.name)}</b><div style="color:var(--orange)">¥${money(x.price)}</div><div class="muted">可售 ${available(i)} 件</div></div><div class="stepper"><button aria-label="减少${esc(x.name)}" onclick="changeQty(${i},-1)" ${S.qty[i]<=0?'disabled':''}>−</button><b>${S.qty[i]||0}</b><button aria-label="增加${esc(x.name)}" onclick="changeQty(${i},1)" ${S.qty[i]>=available(i)?'disabled':''}>+</button></div></div></div>`).join('')}<div class="notice">商品运费 ¥0.00。下单后为你保留库存，需在有效期内完成模拟支付。</div>`},
B04(){foot(btn('模拟登录并继续',"S.login=true;persist();go(S.address?'C02':'C01')"));return `<div class="center" style="padding:70px 10px 35px"><span class="logo-icon" style="width:74px;height:74px;font-size:38px">✳</span><h2>让喜欢，有个着落</h2><p class="muted">登录后保存订单、查看拼团进度。</p></div><div class="card"><b>教学体验账号</b><p class="sub">点击底部按钮进入模拟账号，不获取微信身份，不请求手机号权限。</p></div><div class="notice">已为你保留 ${sumQty()} 件已选商品。</div>`},
C01(){foot(btn('保存并使用',"saveAddress()"));const a=S.address||{name:'',phone:'',region:'',detail:''};return `<div class="notice">请使用测试信息。例如：测试收件人、13800000000、测试省测试市测试区、示例路 1 号。</div>${field('收件人','name',a.name,'测试收件人')}${field('联系电话','phone',a.phone,'13800000000')}${field('省 / 市 / 区','region',a.region,'测试省 测试市 测试区')}${field('详细地址','detail',a.detail,'示例路 1 号')}<div id="addressError" class="error"></div>${full('填入示例地址','sampleAddress()','outline')}${S.address?full('删除这个地址',`confirmAction('删除已保存的测试地址？已有订单的地址快照不会改变。',"S.address=null;go('C01')")`,'danger'):''}`},
C02(){foot(`<div><span class="muted">合计</span><div class="money"><small>¥</small>${money(total())}</div></div>${btn('提交订单','submitOrder()','primary',!S.agreed||!S.address||!sumQty())}`);return `<button class="card" style="text-align:left;width:100%" onclick="go('C01')"><b>收货地址　›</b><p class="sub">${S.address?esc(S.address.name)+'　'+esc(S.address.phone)+'<br>'+esc(S.address.region+' '+S.address.detail):'请选择测试地址'}</p></button><div class="card"><h3>商品清单</h3>${S.group.specs.map((x,i)=>S.qty[i]?`<div class="row" style="margin:13px 0">${bear(i===1)}<div class="col"><b>${esc(x.name)}</b><div class="muted">¥${money(x.price)} × ${S.qty[i]}</div></div><b>¥${money(x.price*S.qty[i])}</b></div>`:'').join('')}<div class="line"></div><div class="row"><span>运费</span><span>¥0.00</span></div></div>${rules()}<label class="check"><input id="agree" type="checkbox" ${S.agreed?'checked':''} onchange="S.agreed=this.checked;render()"><span>已阅读参团规则，并知晓这是模拟交易</span></label>`},
C03(){if(!S.order)return noOrder();if(S.order.state!=='pending')return currentResult();foot(btn('取消订单',`confirmAction('取消后释放本订单预占库存。确定取消？',"closeOrder('用户取消');go('C04')")`,'outline')+btn('去模拟支付',"go('D01')"));return `<div class="center"><span class="tag">等待支付</span><h2>好物已为你暂留</h2><div class="muted">剩余支付时间</div><div class="countdown" data-countdown></div><p class="muted">到期自动关闭，请及时完成模拟支付</p></div>${orderCard()}${addressCard()}<div class="notice">订单到期：${fmt(S.order.expires)}。返回页面不会自动取消订单。</div>`},
C04(){if(!S.order)return noOrder();return `<div class="center"><div class="success orange">×</div><h2>订单已关闭</h2><p class="muted">${esc(S.order.reason||'订单已关闭')}</p></div>${orderCard()}<div class="notice">预占库存已释放；本订单未支付，不产生退款。</div>${full('返回团详情',"go('B02')")}`},
D01(){if(!S.order)return noOrder();if(S.order.state!=='pending')return currentResult();foot(btn('模拟支付成功',"pay('success')"));return `<div class="center"><div class="muted">订单应付</div><div class="money" style="font-size:42px">¥${money(S.order.total)}</div><p class="muted">剩余 <span data-countdown></span></p></div><div class="card"><div class="row"><span class="logo-icon">¥</span><div class="col"><b>模拟支付</b><div class="muted">无需银行卡，不会产生真实扣款</div></div><span class="bullet">●</span></div></div>${orderCard()}<h3 class="section-title">体验其他支付结果</h3>${full('模拟支付失败',"pay('fail')",'outline')}${full('模拟结果未知',"pay('unknown')",'outline')}`},
D02(){return result('✓','模拟支付成功','已支付，待成团','green')+orderCard()+`<div class="notice">${S.group.state==='open'?'尚未到截止时间，请耐心等待成团结果。':'拼团已有截止结果，请查看当前订单状态。'}</div>`+full('查看订单',"go('orders')")},
D03(){if(S.order?.state!=='pending')return currentResult();foot(btn('重试模拟支付',"go('D01')"));return result('!','本次模拟支付失败','订单仍待支付，可在原有效期内重试。','orange')+`<div class="center"><div class="muted">剩余支付时间</div><div class="countdown" data-countdown></div></div>`+orderCard()+full('返回订单',"go('C03')",'outline')},
D04(){return result('…','正在确认支付结果','结果尚未确认，请勿重复操作。','orange')+orderCard()+`<div class="notice">查询已有订单的支付结果，不会新建订单或再次扣款。</div>`+full('刷新订单状态','queryPay()')},
E01(){return result('◷','已截止，结果确认中','正在确认最终已支付件数，请稍候。','orange')+groupCard()+full('刷新状态','resolveSettlement()')},
E02(){return result('✓','我们拼团成功啦','好物即将启程，感谢一起等待的你。','green')+`<div class="card row"><div><div class="muted">截止已支付</div><b style="font-size:25px">${S.group.finalCount??paidCount()} 件</b></div><div><div class="muted">最低成团门槛</div><b style="font-size:25px">${S.group.min} 件</b></div></div><div class="notice green">成团结果已确定。已支付订单等待团长发货。</div>`+full('查看我的订单',"go('orders')")},
E03(){return result('×','这次还差一点点','本期未成团，期待下一次相遇。','orange')+`<div class="card row"><span>截止已支付 ${S.group.finalCount??paidCount()} 件</span><span class="muted">门槛 ${S.group.min} 件</span></div>`+(S.order&&['refund','refunded'].includes(S.order.state)?`<div class="card"><div class="row"><b>${S.order.state==='refunded'?'已模拟退款':'模拟退款处理失败'}</b><span class="money">¥${money(S.order.total)}</span></div><p class="sub">${S.order.state==='refunded'?'无真实资金变动，记录已保留。':'等待团长处理，可刷新查看最新结果。'}</p></div>${full('刷新退款记录',"toast('已读取最新退款状态');render()",'outline')}`:`<div class="notice">${S.order?.state==='closed'?'未支付订单已关闭，不产生退款。':'当前账号没有需要退款的已支付订单。'}</div>`)+full('查看我的订单',"go('orders')")},
E04(){if(S.group.state!=='failed')return `<div class="notice">本团尚未产生未成团退款，无需处理。</div>`;return `<h2 class="title">退款处理</h2><p class="sub">本期未成团 · 逐笔确认退款结果</p><div class="card row"><span>已完成 <b>${S.order?.state==='refunded'?1:0}</b> 笔</span><span>待处理 <b>${S.order?.state==='refund'?1:0}</b> 笔</span></div>${orderCard()}${S.order?.state==='refund'?'<div class="notice red">模拟退款处理失败，请重试。</div>'+full('重试模拟退款','refundRetry()'): '<div class="notice green">当前没有待处理的异常退款。</div>'}`},
F01(){if(!S.order)return noOrder();return `<div class="tabs"><button class="selected">本团订单</button></div><div class="card"><div class="row"><b>${orderStatus()}</b><span class="muted">${S.order.id}</span></div>${orderItems()}<div class="muted">测试收件人 · 联系方式与地址已隐藏</div>${full('查看订单详情',"hostOrder()",'outline')}</div>${S.group.state==='failed'?full('查看异常退款',"go('E04')",'outline'):''}`},
F02(){if(!S.order||S.order.state!=='paid'||S.group.state!=='success')return '<div class="notice">当前订单不满足发货条件。</div>'+full('返回订单管理',"go('F01')");foot(btn('核对并确认发货','shippingConfirm()'));return orderCard()+addressCard()+`<div class="notice">整单一个包裹，发货后不可修改物流信息。</div>${field('承运商','carrier','教学快递')}${field('演示运单号','tracking','DEMO0001')}<div id="shippingError" class="error"></div>`},
F03(){if(!S.order||!['shipped','complete'].includes(S.order.state))return currentResult();if(S.order.state==='shipped')foot(btn('确认收货',`confirmAction('确认收到本订单全部商品？这是模拟收货操作。','receive()')`));return `<span class="tag green">${orderStatus()}</span>${orderCard()}<div class="card"><h3>物流信息</h3><div class="row"><span class="muted">承运商</span><b>${esc(S.order.shipping.carrier)}</b></div><div class="row"><span class="muted">运单号</span><b>${esc(S.order.shipping.tracking)}</b></div><div class="shipping-line"><b>团长已录入模拟物流</b><div class="muted">${fmt(S.order.shipping.time)}</div></div><div class="notice">模拟物流，仅用于教学；不会产生真实运输和签收记录。</div></div>`},
F04(){return result('✓','这份喜欢，已送达','订单已完成，谢谢你的参与。','green')+orderCard()+`<div class="notice green">${S.order?.received?fmt(S.order.received):''} 确认收货。订单与物流记录保留，不再修改。</div>`+full('返回拼团广场',"go('B01')")},
orders(){tabbar();if(!S.order)return noOrder();return `<h2 class="title">我的订单</h2><p class="sub">记录每一份小小的期待</p><div class="card"><div class="row"><span class="tag">${orderStatus()}</span><span class="muted">${fmt(S.order.created)}</span></div>${orderItems()}<div class="line"></div><div class="row"><span>共 ${S.order.items.reduce((a,x)=>a+x.qty,0)} 件</span><b>¥${money(S.order.total)}</b></div>${full('查看订单','openOrder()','outline')}</div>`},
A01(){tabbar();return `<div class="row">${title('我的拼团')}${btn('+ 新建',"newDraft()")}</div><p class="sub">认真准备，把好物分享给同好。</p>${S.draft?`<div class="card"><span class="tag">草稿</span><h3>${esc(S.draft.title||'未命名拼团')}</h3>${full('继续编辑',"editing=clone(S.draft);dirty=false;go('A02')",'outline')}${full('删除草稿',`confirmAction('删除这份草稿？已发布拼团不受影响。',"S.draft=null;render()")`,'danger')}</div>`:''}${S.mode==='empty'?'<div class="empty"><h3>还没有拼团</h3><p class="muted">从一个喜欢的商品开始吧。</p></div>':groupCard()+full('查看已发布拼团',"go('A04')",'outline')}`},
A02(){if(!editing)editing=clone(S.draft||S.group);foot(btn('保存草稿','saveDraft()','outline')+btn('预览发布','preview()'));return `<p class="sub">将你的心意，一项项准备好。</p>${editField('商品名称','title',editing.title,40)}<label class="field">商品封面 <span class="required">*</span></label><div class="upload">${editing.cover?`<img class="art" src="${editing.cover}" alt="上传封面">`:bear()}<label>＋ 更换图片<input aria-label="上传商品封面" type="file" accept="image/png,image/jpeg" onchange="upload(this)"></label></div><div class="muted">默认使用示例封面 · JPG / PNG · 不超过 5MB</div>${errors.cover?'<div class="error">'+errors.cover+'</div>':''}<label class="field">商品说明 <span class="required">*</span><textarea maxlength="2000" oninput="editing.desc=this.value;dirty=true">${esc(editing.desc)}</textarea></label>${err('desc')}<h3 class="section-title">商品规格</h3>${editing.specs.map((x,i)=>`<div class="spec-edit"><input aria-label="规格${i+1}名称" maxlength="30" value="${esc(x.name)}" oninput="editing.specs[${i}].name=this.value;dirty=true"><div class="row"><label>单价（元）<input aria-label="规格${i+1}价格" type="number" min=".01" max="99999.99" step=".01" value="${money(x.price)}" oninput="editing.specs[${i}].price=Math.round(Number(this.value)*100);dirty=true"></label><label>库存（件）<input aria-label="规格${i+1}库存" type="number" min="1" max="9999" step="1" value="${x.stock}" oninput="editing.specs[${i}].stock=Number(this.value);dirty=true"></label></div>${editing.specs.length>1?full('移除此规格',`editing.specs.splice(${i},1);dirty=true;render()`,'outline'):''}</div>`).join('')}${err('specs')}${full('＋ 添加规格',"addSpec()",'outline',editing.specs.length>=20)}${editField('最低成团件数','min',editing.min,0,'number')}${editField('截止时间（北京时间）','cut',localDT(editing.cut),0,'datetime-local')}${editField('预计发货时间（北京时间）','ship',localDT(editing.ship),0,'datetime-local')}<div class="notice">发布后冻结商品、价格、库存和时间。发布前请认真核对。</div>`},
A03(){const g=editing||S.draft||S.group;foot(btn('返回编辑',"go('A02')",'outline')+btn('确认发布',`confirmAction('发布后立即开售，商品及规则不可修改。确认发布？','publish()')`));return `<div class="notice">发布前最后确认 · 以下内容发布后不可编辑</div><div class="hero">${g.cover?`<img class="art" src="${g.cover}" alt="封面">`:bear()}</div>${title(g.title)}<p class="sub">${esc(g.desc)}</p><div class="card">${g.specs.map(x=>`<div class="row"><b>${esc(x.name)}</b><span>¥${money(x.price)} · ${x.stock} 件</span></div>`).join('<div class="line"></div>')}</div>${rules(g)}`},
A04(){foot(btn('订单管理',"go('F01')",'outline')+btn('查看买家页面',"go('B02')"));return `<div class="notice green">拼团已发布 · 商品与规则已冻结</div>${groupCard()}${rules()}${S.group.state==='failed'?full('处理异常退款',"go('E04')",'outline'):''}<div class="notice">团长可管理订单与履约，不可中途改价、改库存或撤团。</div>`}
};
function field(label,id,value,placeholder=''){return `<label class="field">${label} <span class="required">*</span><input id="${id}" value="${esc(value)}" placeholder="${placeholder}" maxlength="${id==='detail'?100:60}"></label>`}function err(k){return errors[k]?`<div class="error">${errors[k]}</div>`:''}function editField(label,k,value,max=0,type='text'){let handler=['cut','ship'].includes(k)?`editing.${k}=new Date(this.value+':00+08:00').getTime()`:(type==='number'?`editing.${k}=Number(this.value)`:`editing.${k}=this.value`);return `<label class="field">${label} <span class="required">*</span><input type="${type}" value="${esc(value)}" ${max?'maxlength="'+max+'"':''} oninput="${handler};dirty=true"></label>${err(k)}`}
function result(symbol,heading,sub,color){return `<div class="center"><div class="success ${color==='orange'?'orange':''}">${symbol}</div><h2>${heading}</h2><p class="sub">${sub}</p></div>`}function noOrder(){return `<div class="empty"><div class="symbol">♧</div><h3>还没有订单</h3><p class="muted">去看看有什么喜欢的好物吧。</p>${full('去拼团广场',"go('B01')")}</div>`}function orderStatus(){return {pending:'待支付',closed:'已关闭',paid:S.group.state==='success'?'待发货':'已支付 · 待成团',refund:'模拟退款失败',refunded:'已模拟退款',shipped:'已发货',complete:'已完成'}[S.order?.state]||'暂无订单'}function addressCard(){const a=S.order?.address;return a?`<div class="card"><h3>收货信息</h3><b>${esc(a.name)}　${esc(a.phone)}</b><p class="sub">${esc(a.region+' '+a.detail)}</p></div>`:''}function currentResult(){return `<div class="notice">当前订单：${orderStatus()}</div>${orderCard()}${full('查看最新状态','openOrder()')}`}
function changeQty(i,d){S.qty[i]=Math.max(0,Math.min(available(i),(S.qty[i]||0)+d));render()}function chooseNext(){if(S.group.state!=='open'||now()>=S.group.cut)return toast('本团已截止');if(!sumQty())return toast('请先选择规格');go(!S.login?'B04':S.address?'C02':'C01')}
function sampleAddress(){for(const [k,v] of Object.entries({name:'测试收件人',phone:'13800000000',region:'测试省 测试市 测试区',detail:'示例路 1 号'}))$(k).value=v}function saveAddress(){let a=Object.fromEntries(['name','phone','region','detail'].map(k=>[k,$(k).value.trim()]));if(!a.name||!/^1\d{10}$/.test(a.phone)||!a.region||!a.detail){$('addressError').textContent='请完整填写测试地址，联系电话需为 11 位手机号格式。';return}S.address=a;S.agreed=false;go('C02')}
function submitOrder(){if(!S.login||!S.agreed||!S.address||!sumQty())return toast('请完成地址与规则确认');if(S.order&&['pending','paid','shipped'].includes(S.order.state))return showModal(`<h3>已有进行中的订单</h3><p>本原型一次演示一笔订单，请先继续已有订单。</p>${full('查看已有订单',"closeModal();go('orders')")}${full('返回','closeModal()','outline')}`);if(S.group.state!=='open'||now()>=S.group.cut)return toast('本团已截止，无法下单');if(S.qty.some((q,i)=>q>available(i)))return toast('库存已变化，请重新选择');S.order={id:'PT'+now().toString().slice(-9),title:S.group.title,items:S.group.specs.map((x,i)=>({...clone(x),index:i,qty:S.qty[i]})).filter(x=>x.qty>0),total:total(),state:'pending',created:now(),expires:Math.min(now()+15*60000,S.group.cut),address:clone(S.address)};go('C03')}
function closeOrder(reason){if(S.order?.state==='pending'){S.order.state='closed';S.order.reason=reason;persist()}}function pay(mode){if(expired()||S.order?.state!=='pending')return go('C04');if(mode==='fail')return go('D03');if(mode==='unknown'){S.order.unknown=true;return go('D04')}S.order.state='paid';S.order.paidAt=now();S.order.unknown=false;go('D02')}
function queryPay(){if(expired())return go('C04');if(S.order?.state==='pending'){S.order.unknown=false;toast('已确认订单仍待支付，可继续支付');go('C03')}else openOrder()}
function openOrder(){if(!S.order)return go('orders');const map={pending:S.order.unknown?'D04':'C03',closed:'C04',paid:S.group.state==='success'?'E02':'D02',refund:'E03',refunded:'E03',shipped:'F03',complete:'F04'};go(map[S.order.state]||'orders')}
function newDraft(){if(S.draft){editing=clone(S.draft)}else{editing=clone(S.group);editing.title='';editing.desc='';editing.cut=now()+3*86400000;editing.ship=now()+8*86400000;editing.paid=0;editing.state='open'}dirty=false;go('A02')}function saveDraft(route='A01'){S.draft=clone(editing);dirty=false;closeModal();go(route);toast('草稿已保存')}
function addSpec(){if(editing.specs.length<20){editing.specs.push({name:'',price:3900,stock:10});dirty=true;render()}}function upload(input){const f=input.files[0];if(!f)return;if(!['image/png','image/jpeg'].includes(f.type)||f.size>5*1024*1024){errors.cover='请选择不超过 5MB 的 JPG 或 PNG 图片';render();return}const reader=new FileReader;reader.onload=()=>{editing.cover=reader.result;dirty=true;delete errors.cover;render()};reader.onerror=()=>{errors.cover='图片读取失败，请重新选择';render()};reader.readAsDataURL(f)}
function validateDraft(){errors={};const g=editing;if(g.title.trim().length<2||g.title.trim().length>40)errors.title='商品名称需为 2～40 字';if(!g.desc.trim()||g.desc.length>2000)errors.desc='请填写 1～2000 字商品说明';if(g.specs.some(x=>!x.name.trim()||x.name.length>30||!Number.isInteger(x.stock)||x.stock<1||x.stock>9999||!Number.isInteger(x.price)||x.price<1||x.price>9999999)||new Set(g.specs.map(x=>x.name.trim())).size!==g.specs.length)errors.specs='规格名需唯一且为 1～30 字；单价 0.01～99999.99，库存为 1～9999 的整数';if(!Number.isInteger(g.min)||g.min<1||g.min>g.specs.reduce((a,x)=>a+x.stock,0))errors.min='成团件数须为正整数，且不超过总库存';if(!g.cut||g.cut<=now())errors.cut='截止时间必须晚于当前时间';if(!g.ship||g.ship<=g.cut)errors.ship='预计发货必须晚于截止时间';return !Object.keys(errors).length}function preview(){if(!validateDraft()){render();setTimeout(()=>$('screen').querySelector('.error')?.scrollIntoView({block:'center'}),0);return}dirty=false;go('A03')}function publish(){if(!validateDraft()){go('A02');return}S.group={...clone(editing),paid:0,state:'open'};S.draft=null;S.order=null;S.qty=S.group.specs.map(()=>0);editing=null;S.mode='normal';go('A04');toast('发布成功')}
function hostOrder(){if(S.order?.state==='paid'&&S.group.state==='success')return go('F02');showModal(`<h3>${orderStatus()}</h3>${orderCard()}${addressCard()}${full('关闭','closeModal()','outline')}`)}function shippingConfirm(){const carrier=$('carrier').value.trim(),tracking=$('tracking').value.trim();if(!carrier||!tracking){$('shippingError').textContent='请填写承运商和演示运单号';return}S.shippingDraft={carrier,tracking};confirmAction('核对完成？整单发货后不可修改物流信息。','shipOrder()')}function shipOrder(){if(S.role!=='host'||S.group.state!=='success'||S.order?.state!=='paid')return toast('当前订单不能发货');S.order.shipping={...S.shippingDraft,time:now()};S.order.state='shipped';go('F01');toast('模拟发货成功')}function receive(){if(S.role!=='buyer'||S.order?.state!=='shipped')return toast('当前状态不能确认收货');S.order.state='complete';S.order.received=now();go('F04')}
function refundRetry(){if(S.role!=='host'||S.group.state!=='failed'||S.order?.state!=='refund')return;S.order.state='refunded';S.order.refunded=now();persist();render();toast('模拟退款成功，未产生真实资金变动')}
function switchRole(role){if(S.route==='A02'&&dirty)return toast('请先保存或放弃当前草稿');S.role=role;S.mode='normal';go(role==='host'?'A01':'B01')}
function settlePrompt(){if(S.group.state!=='open')return toast('本团已有截止结果，请重置场景后再体验');showModal(`<h3>快进到截止结算</h3><p class="muted">这是原型演示控制。请选择其他买家的最终已支付件数，以体验不同成团分支。</p><label class="field">其他买家已支付件数<input id="otherCount" type="number" min="0" max="50" value="${S.group.paid}"></label><label class="check"><input id="refundFail" type="checkbox">模拟退款处理失败</label>${full('模拟到达截止时间','settleFromPanel()')}${full('取消','closeModal()','outline')}`)}function settleFromPanel(){let n=Number($('otherCount').value);if(!Number.isInteger(n)||n<0||n>S.group.specs.reduce((a,x)=>a+x.stock,0)-(S.order?.state==='paid'?S.order.items.reduce((a,x)=>a+x.qty,0):0))return toast('件数需为非负整数，且不能超过可售总量');S.refundFail=$('refundFail').checked;S.group.paid=n;S.group.cut=now();closeOrder('拼团已截止，未支付订单已关闭');S.group.state='settling';go('E01')}
function resolveSettlement(){if(S.group.state==='settling'){closeOrder('拼团已截止，未支付订单已关闭');S.group.finalCount=paidCount();S.group.state=S.group.finalCount>=S.group.min?'success':'failed';if(S.group.state==='failed'&&S.order?.state==='paid'){S.order.state=S.refundFail?'refund':'refunded'}}go(S.group.state==='success'?'E02':S.group.state==='failed'?'E03':'B02')}
function expirePrompt(){if(S.order?.state!=='pending')return toast('当前没有待支付订单');confirmAction('将当前订单模拟为支付超时？','S.order.expires=now()-1;expired();go(\'C04\')')}
function seedOrder(state='paid'){S.login=true;S.address={name:'测试收件人',phone:'13800000000',region:'测试省 测试市 测试区',detail:'示例路 1 号'};S.qty=[1,1];S.agreed=true;S.order={id:'PT20261018001',title:S.group.title,items:S.group.specs.map((x,i)=>({...clone(x),index:i,qty:1})),total:7800,state,created:now()-120000,expires:now()+13*60000,address:clone(S.address)};if(['shipped','complete'].includes(state))S.order.shipping={carrier:'教学快递',tracking:'DEMO0001',time:now()-60000};if(state==='complete')S.order.received=now()}
function preset(name){S=initial();editing=null;dirty=false;historyRoutes=[];if(name==='normal'){}else if(['empty','error','denied'].includes(name))S.mode=name;else{seedOrder(['payfail','unknown'].includes(name)?'pending':name==='refund'?'refund':name==='shipped'?'shipped':name==='complete'?'complete':'paid');if(['success','shipped','complete'].includes(name)){S.group.state='success';S.group.paid=10;S.group.finalCount=12;S.group.cut=now()-60000}if(name==='refund'){S.group.state='failed';S.group.finalCount=8;S.group.cut=now()-60000}if(name==='unknown')S.order.unknown=true;S.route={payfail:'D03',unknown:'D04',success:'E02',refund:'E03',shipped:'F03',complete:'F04'}[name]}closeModal();persist();render();toast('已载入演示场景')}
function confirmReset(){confirmAction('重置本机原型的所有演示数据和草稿？',"preset('normal')")}
function jump(id){S=initial();editing=null;dirty=false;S.role=/^[AF]/.test(id)||id==='E04'?'host':'buyer';if(/^A/.test(id)){if(id==='A02'||id==='A03'){editing=clone(S.group);S.draft=clone(editing)}}if(['B03','B04','C01','C02'].includes(id)){S.qty=[1,1];S.login=id.startsWith('C');if(id==='C02'){S.address={name:'测试收件人',phone:'13800000000',region:'测试省 测试市 测试区',detail:'示例路 1 号'}}}if(/^[CDEF]/.test(id)&&!['C01','C02'].includes(id)){seedOrder(/^C|D01|D03|D04/.test(id)?'pending':'paid');if(id==='C04'){S.order.state='closed';S.order.reason='支付超时，订单已关闭'}if(id==='D04')S.order.unknown=true;if(id==='E01')S.group.state='settling';if(['E02','F01','F02','F03','F04'].includes(id)){S.group.state='success';S.group.paid=10;S.group.finalCount=12;S.group.cut=now()-60000}if(['E03','E04'].includes(id)){S.group.state='failed';S.group.finalCount=8;S.order.state='refund';S.group.cut=now()-60000}if(['F03','F04'].includes(id)){S.role='buyer';S.order.state=id==='F03'?'shipped':'complete';S.order.shipping={carrier:'教学快递',tracking:'DEMO0001',time:now()-60000};if(id==='F04')S.order.received=now()}}S.route=id;closeModal();render();toast('已载入 '+id+' 页面样例')}
function demoPanel(){showModal(`<h3>原型演示面板</h3><p class="muted">以下控制不属于小程序产品。页面样例会重置演示数据。</p><div class="row">${btn('买家视角',"closeModal();switchRole('buyer')",'outline')}${btn('团长视角',"closeModal();switchRole('host')",'outline')}</div>${full('快进截止结算','settlePrompt()','outline')}${full('模拟订单超时','expirePrompt()','outline')}<select aria-label="预设场景" onchange="preset(this.value)"><option value="normal">选择演示场景</option><option value="normal">正常参团</option><option value="payfail">支付失败</option><option value="unknown">结果未知</option><option value="success">已成团</option><option value="refund">退款失败</option><option value="shipped">已发货</option><option value="complete">已完成</option><option value="empty">空列表</option><option value="error">加载失败</option><option value="denied">无权限</option></select><div class="panel map">${Object.entries(META).map(([id,v])=>`<button onclick="jump('${id}')">${id} ${v[0]}</button>`).join('')}</div>${full('关闭面板','closeModal()','outline')}`)}
setInterval(()=>{let didExpire=expired();if(didExpire&&['C03','D01','D03','D04'].includes(S.route)){go('C04');return}document.querySelectorAll('[data-countdown]').forEach(el=>{let sec=Math.max(0,Math.ceil(((S.order?.expires||now())-now())/1000));el.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')})},1000);
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&$('overlay').firstChild){const f=[...$('overlay').querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0]?.focus()}}});render();
</script></body></html>
